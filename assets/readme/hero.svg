<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">kube-waste — stop burning money on Kubernetes</title>
  <desc id="desc">A read-only CLI that scans a Kubernetes cluster for wasted resources and estimates monthly savings in dollars. The scan found unused PVCs, services, zombie deployments, and orphaned pods totalling $22.30 per month in potential savings.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#2EA043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#0D1117"/>

  <!-- subtle grid for terminal rhythm -->
  <g stroke="#161B22" stroke-width="1">
    <line x1="64" y1="66" x2="64" y2="356"/>
    <line x1="1136" y1="66" x2="1136" y2="356"/>
  </g>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="96" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">KUBERNETES WASTE DETECTOR</text>

    <text x="0" y="168" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700">kube-waste</text>

    <text x="0" y="220" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="600">Stop burning money on Kubernetes.</text>

    <text x="0" y="258" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21">A read-only scan that turns idle resources into</text>
    <text x="0" y="286" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21">dollar estimates. No agents. No sidecars.</text>

    <text x="0" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
      <tspan fill="#3FB950" font-weight="700">$</tspan><tspan fill="#E6EDF3"> ./kube-waste</tspan>
    </text>
    <rect x="194" y="306" width="11" height="24" rx="3" fill="#3FB950"/>
  </g>

  <g id="savings-card" transform="translate(700 48)">
    <rect width="436" height="300" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>

    <text x="32" y="42" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2">SCAN RESULTS</text>
    <text x="404" y="42" text-anchor="end" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">$/mo</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <circle cx="40" cy="82" r="5" fill="#D29922"/>
      <text x="60" y="87" fill="#E6EDF3">Unused PVC</text>
      <text x="404" y="87" text-anchor="end" fill="#3FB950">$5.00/mo</text>

      <circle cx="40" cy="128" r="5" fill="#D29922"/>
      <text x="60" y="133" fill="#E6EDF3">Unused Service</text>
      <text x="404" y="133" text-anchor="end" fill="#3FB950">$15.00/mo</text>

      <circle cx="40" cy="174" r="5" fill="#D29922"/>
      <text x="60" y="179" fill="#E6EDF3">Zombie Deploy</text>
      <text x="404" y="179" text-anchor="end" fill="#3FB950">$0.00/mo</text>

      <circle cx="40" cy="220" r="5" fill="#D29922"/>
      <text x="60" y="225" fill="#E6EDF3">Orphaned Pod</text>
      <text x="404" y="225" text-anchor="end" fill="#3FB950">$2.30/mo</text>
    </g>

    <line x1="32" y1="248" x2="404" y2="248" stroke="#21262D" stroke-width="1"/>

    <text x="32" y="272" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1">TOTAL POTENTIAL SAVINGS</text>
    <text x="32" y="304" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700">$22.30 / month</text>
  </g>
</svg>
