<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">How kube-waste works</title>
  <desc id="desc">A read-only pipeline: kube-waste reads a snapshot of your cluster (deployments, pods, PVCs, services, endpoint slices), runs one detector per waste type, then prices the findings into a monthly dollar estimate.</desc>

  <rect width="1200" height="400" rx="24" fill="#0D1117"/>

  <text x="64" y="72" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="4">HOW IT WORKS</text>

  <g id="box-cluster" transform="translate(64 120)">
    <rect width="180" height="180" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <g stroke="#30363D" stroke-width="1.5" fill="none">
      <line x1="90" y1="38" x2="64" y2="80"/>
      <line x1="90" y1="38" x2="116" y2="80"/>
      <line x1="64" y1="80" x2="116" y2="80"/>
    </g>
    <circle cx="90" cy="38" r="12" fill="#21262D" stroke="#8B949E" stroke-width="1.5"/>
    <circle cx="64" cy="80" r="12" fill="#21262D" stroke="#8B949E" stroke-width="1.5"/>
    <circle cx="116" cy="80" r="12" fill="#21262D" stroke="#8B949E" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="3" fill="#8B949E"/>
    <circle cx="64" cy="80" r="3" fill="#8B949E"/>
    <circle cx="116" cy="80" r="3" fill="#8B949E"/>
    <text x="90" y="130" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600">Cluster</text>
    <text x="90" y="156" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">kubeconfig</text>
  </g>

  <g id="arrow-1">
    <line x1="252" y1="210" x2="278" y2="210" stroke="#30363D" stroke-width="2"/>
    <path d="M278 210 l-12 -6 v12 z" fill="#8B949E"/>
  </g>

  <g id="box-snapshot" transform="translate(288 120)">
    <rect width="200" height="180" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="100" y="40" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600">Snapshot</text>
    <line x1="24" y1="58" x2="176" y2="58" stroke="#21262D" stroke-width="1"/>
    <g fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="86">deployments</text>
      <text x="24" y="108">pods</text>
      <text x="24" y="130">PVCs</text>
      <text x="24" y="152">services</text>
      <text x="24" y="174">endpoint slices</text>
    </g>
  </g>

  <g id="arrow-2">
    <line x1="496" y1="210" x2="522" y2="210" stroke="#30363D" stroke-width="2"/>
    <path d="M522 210 l-12 -6 v12 z" fill="#8B949E"/>
  </g>

  <g id="box-detectors" transform="translate(532 120)">
    <rect width="300" height="180" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="150" y="40" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600">Detectors</text>
    <line x1="24" y1="56" x2="276" y2="56" stroke="#21262D" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <g>
        <rect x="24" y="70" width="124" height="42" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
        <circle cx="38" cy="91" r="3" fill="#D29922"/>
        <text x="48" y="95" fill="#E6EDF3">Unused PVC</text>
      </g>
      <g>
        <rect x="164" y="70" width="124" height="42" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
        <circle cx="178" cy="91" r="3" fill="#D29922"/>
        <text x="188" y="95" fill="#E6EDF3">Unused Svc</text>
      </g>
      <g>
        <rect x="24" y="122" width="124" height="42" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
        <circle cx="38" cy="143" r="3" fill="#D29922"/>
        <text x="48" y="147" fill="#E6EDF3">Zombie Dep</text>
      </g>
      <g>
        <rect x="164" y="122" width="124" height="42" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
        <circle cx="178" cy="143" r="3" fill="#D29922"/>
        <text x="188" y="147" fill="#E6EDF3">Orphan Pod</text>
      </g>
    </g>
  </g>

  <g id="arrow-3">
    <line x1="840" y1="210" x2="866" y2="210" stroke="#30363D" stroke-width="2"/>
    <path d="M866 210 l-12 -6 v12 z" fill="#8B949E"/>
  </g>

  <g id="box-pricing" transform="translate(876 120)">
    <rect width="260" height="180" rx="12" fill="#12261B" stroke="#2EA043" stroke-width="1.5"/>
    <text x="130" y="40" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600">Pricing</text>
    <text x="130" y="110" text-anchor="middle" fill="#3FB950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700">$22.30</text>
    <text x="130" y="136" text-anchor="middle" fill="#7EE787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">/ month</text>
    <line x1="24" y1="150" x2="236" y2="150" stroke="#2EA043" stroke-width="1"/>
    <text x="130" y="170" text-anchor="middle" fill="#7EE787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">potential savings</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E" text-anchor="middle">
    <text x="154" y="330">via local kubeconfig</text>
    <text x="388" y="330">one list call per kind</text>
    <text x="682" y="330">one detector per waste type</text>
    <text x="1006" y="330">read-only, nothing modified</text>
  </g>
</svg>
