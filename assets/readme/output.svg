<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">kube-waste example output</title>
  <desc id="desc">Real terminal output: scanning a Kubernetes cluster lists an unused PVC for $5.00/mo, an unused LoadBalancer service for $15.00/mo, a zombie deployment for $0.00/mo, and an orphaned pod for $2.30/mo, for a total potential savings of $22.30 per month.</desc>

  <rect width="1200" height="560" rx="24" fill="#0D1117"/>

  <g id="terminal" transform="translate(48 40)">
    <rect width="1104" height="480" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>

    <!-- title bar -->
    <circle cx="40" cy="28" r="6" fill="#F85149"/>
    <circle cx="60" cy="28" r="6" fill="#E3B341"/>
    <circle cx="80" cy="28" r="6" fill="#3FB950"/>
    <text x="552" y="33" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">kube-waste</text>
    <text x="1064" y="33" text-anchor="end" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">read-only</text>
    <line x1="0" y1="52" x2="1104" y2="52" stroke="#21262D" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="56" y="106">
        <tspan fill="#3FB950" font-weight="700">$</tspan><tspan fill="#E6EDF3"> ./kube-waste</tspan>
      </text>
      <text x="56" y="136" fill="#8B949E">Using config from current directory: kubeconfig</text>
      <text x="56" y="166" fill="#8B949E">Scanning cluster for waste (Go Version)...</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <!-- header -->
      <text x="104" y="236" fill="#E6EDF3" font-weight="700">TYPE</text>
      <text x="320" y="236" fill="#E6EDF3" font-weight="700">NAMESPACE</text>
      <text x="450" y="236" fill="#E6EDF3" font-weight="700">NAME</text>
      <text x="644" y="236" fill="#E6EDF3" font-weight="700">DETAILS</text>
      <text x="946" y="236" fill="#E6EDF3" font-weight="700">EST. SAVINGS</text>

      <!-- separator -->
      <text x="104" y="266" fill="#8B949E">----</text>
      <text x="320" y="266" fill="#8B949E">---------</text>
      <text x="450" y="266" fill="#8B949E">----</text>
      <text x="644" y="266" fill="#8B949E">-------</text>
      <text x="946" y="266" fill="#8B949E">------------</text>

      <!-- rows -->
      <text x="104" y="296" fill="#D29922">Unused PVC</text>
      <text x="320" y="296" fill="#E6EDF3">default</text>
      <text x="450" y="296" fill="#E6EDF3">old-mongo-backup</text>
      <text x="644" y="296" fill="#E6EDF3">50Gi (Bound)</text>
      <text x="946" y="296" fill="#3FB950">$5.00/mo</text>

      <text x="104" y="326" fill="#D29922">Unused Service</text>
      <text x="320" y="326" fill="#E6EDF3">payments</text>
      <text x="450" y="326" fill="#E6EDF3">legacy-lb-api</text>
      <text x="644" y="326" fill="#E6EDF3">LoadBalancer (Unused)</text>
      <text x="946" y="326" fill="#3FB950">$15.00/mo</text>

      <text x="104" y="356" fill="#D29922">Zombie Deployment</text>
      <text x="320" y="356" fill="#E6EDF3">backend</text>
      <text x="450" y="356" fill="#E6EDF3">worker-v1</text>
      <text x="644" y="356" fill="#E6EDF3">Replicas: 0 (Scaled Down)</text>
      <text x="946" y="356" fill="#3FB950">$0.00/mo</text>

      <text x="104" y="386" fill="#D29922">Orphaned Pod</text>
      <text x="320" y="386" fill="#E6EDF3">default</text>
      <text x="450" y="386" fill="#E6EDF3">debug-pod</text>
      <text x="644" y="386" fill="#E6EDF3">0.1 vCPU / 0.1 GB</text>
      <text x="946" y="386" fill="#3FB950">$2.30/mo</text>

      <!-- total -->
      <text x="56" y="426" fill="#8B949E">----------------------------------------------------------------------------</text>
      <text x="56" y="462" font-size="22" font-weight="700" fill="#3FB950">TOTAL POTENTIAL SAVINGS: $22.30 / month</text>
    </g>
  </g>
</svg>
